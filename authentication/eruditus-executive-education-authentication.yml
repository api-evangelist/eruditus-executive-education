notes:
- Each API has its own authorization header name — there is no single shared scheme across the
  Emeritus estate. The reference states this explicitly under "Authentication".
- Tokens are static bearer-equivalents carried in a custom header, not in `Authorization`.
- No OAuth 2.0, no OpenID Connect, no mTLS, no HTTP basic/bearer. /.well-known/openid-configuration
  and /.well-known/oauth-authorization-server return 404 on every Emeritus host (probed 2026-08-04).
- No scope, permission or key-rotation surface is published; scopes/ is therefore not emitted.
- The same token model applies to both the staging and production environments; no test-vs-live
  key prefix scheme is published.
