apis:
- aid: eruditus-executive-education:leads
  name: Emeritus Leads API
  description: 'Partner/vendor entry point for submitting enrollment inquiries into
    Emeritus systems. A single POST endpoint accepts both the consumer (B2C) lead shape
    and the enterprise/team (B2B) shape, selected by sending inquiring_for=team with
    company and participant-count fields. Authenticated with an Emeritus-issued token
    in the LEAD_WEBHOOK_KEY header, with separate staging and production environments.'
  humanURL: https://emeritus-tech.github.io/emeritus-api-docs/api/v1/leads_api/generic_lead.html
  baseURL: https://admissions.emeritus.org/api/v1
