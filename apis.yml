- aid: eruditus-executive-education:programs
  name: Emeritus Programs API
  description: 'Read API over the Emeritus catalog — programs, the partner schools and
    universities that award them, and the landing page templates used to market them.
    Authenticated with an Emeritus-issued token in the HTTP-EE-RESOURCES-API-KEY header.
    The provider''s reference pages for these resources still carry documentation-template
    placeholder content, so request parameters and success response schemas are not
    published.'
  humanURL: https://emeritus-tech.github.io/emeritus-api-docs/api/v1/programs_api/programs.html
