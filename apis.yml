aid: eruditus-executive-education
name: Eruditus
description: 'Eruditus (Eruditus Group) is an online executive-education company founded
  in 2010 by Ashwin Damera and Chaitanya Kalipatnapu and headquartered in Singapore,
  operating consumer and enterprise learning under the Eruditus and Emeritus brands.
  It partners with more than 80 top-tier universities — including MIT, Harvard, Columbia,
  Wharton, Cambridge, INSEAD, IIM, NUS and HKUST — to deliver senior executive programs,
  professional certificates, short courses and degree programs to more than 350,000
  learners across 80+ countries. Its public API surface is a small partner-facing REST
  estate documented at emeritus-tech.github.io/emeritus-api-docs: a Leads API for
  submitting B2C and B2B enrollment inquiries, and a Programs API exposing programs,
  partner schools and landing page templates. Both are token-authenticated with
  Emeritus-issued keys and offer separate staging and production environments.'
